openapi: 3.1.0
info:
  title: Milvus REST Collections Roles API
  description: 'RESTful API for the Milvus vector database (v2). Covers collections, entities,

    indexes, partitions, users, and roles. Sourced from

    https://milvus.io/api-reference/restful/v2.5.x.

    '
  version: 2.5.x
  contact:
    name: Milvus
    url: https://milvus.io
servers:
- url: http://localhost:19530
  description: Default local Milvus instance
security:
- BearerAuth: []
tags:
- name: Roles
paths:
  /v2/vectordb/roles/create:
    post:
      summary: Create a role
      operationId: createRole
      tags:
      - Roles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                roleName:
                  type: string
      responses:
        '200':
          description: Created
  /v2/vectordb/roles/list:
    post:
      summary: List roles
      operationId: listRoles
      tags:
      - Roles
      responses:
        '200':
          description: Roles
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: 'Bearer token of the form `username:password` (e.g. `root:milvus`) when

        authentication is enabled.

        '

openapi: 3.1.0
info:
  title: Milvus REST Collections Partitions API
  description: 'RESTful API for the Milvus vector database (v2). Covers collections, entities,

    indexes, partitions, users, and roles. Sourced from

    https://milvus.io/api-reference/restful/v2.5.x.

    '
  version: 2.5.x
  contact:
    name: Milvus
    url: https://milvus.io
servers:
- url: http://localhost:19530
  description: Default local Milvus instance
security:
- BearerAuth: []
tags:
- name: Partitions
paths:
  /v2/vectordb/partitions/create:
    post:
      summary: Create a partition
      operationId: createPartition
      tags:
      - Partitions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                collectionName:
                  type: string
                partitionName:
                  type: string
      responses:
        '200':
          description: Created
  /v2/vectordb/partitions/drop:
    post:
      summary: Drop a partition
      operationId: dropPartition
      tags:
      - Partitions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                collectionName:
                  type: string
                partitionName:
                  type: string
      responses:
        '200':
          description: Dropped
  /v2/vectordb/partitions/list:
    post:
      summary: List partitions for a collection
      operationId: listPartitions
      tags:
      - Partitions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                collectionName:
                  type: string
      responses:
        '200':
          description: Partitions
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: 'Bearer token of the form `username:password` (e.g. `root:milvus`) when

        authentication is enabled.

        '

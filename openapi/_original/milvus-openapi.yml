openapi: 3.1.0
info:
  title: Milvus REST API
  description: |
    RESTful API for the Milvus vector database (v2). Covers collections, entities,
    indexes, partitions, users, and roles. Sourced from
    https://milvus.io/api-reference/restful/v2.5.x.
  version: 2.5.x
  contact:
    name: Milvus
    url: https://milvus.io
servers:
  - url: http://localhost:19530
    description: Default local Milvus instance
security:
  - BearerAuth: []
paths:
  /v2/vectordb/collections/create:
    post:
      summary: Create a collection
      operationId: createCollection
      tags: [Collections]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                collectionName: { type: string }
                dimension: { type: integer }
                metricType: { type: string }
                idType: { type: string }
                schema: { type: object }
                indexParams:
                  type: array
                  items: { type: object }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
  /v2/vectordb/collections/describe:
    get:
      summary: Describe a collection
      operationId: describeCollection
      tags: [Collections]
      parameters:
        - name: collectionName
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Collection details
  /v2/vectordb/collections/list:
    get:
      summary: List collections
      operationId: listCollections
      tags: [Collections]
      responses:
        '200':
          description: Collection names
  /v2/vectordb/collections/drop:
    post:
      summary: Drop a collection
      operationId: dropCollection
      tags: [Collections]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                collectionName: { type: string }
      responses:
        '200':
          description: Success
  /v2/vectordb/collections/load:
    post:
      summary: Load a collection into memory
      operationId: loadCollection
      tags: [Collections]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                collectionName: { type: string }
      responses:
        '200':
          description: Success
  /v2/vectordb/collections/release:
    post:
      summary: Release a collection from memory
      operationId: releaseCollection
      tags: [Collections]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                collectionName: { type: string }
      responses:
        '200':
          description: Success
  /v2/vectordb/collections/rename:
    post:
      summary: Rename a collection
      operationId: renameCollection
      tags: [Collections]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                collectionName: { type: string }
                newCollectionName: { type: string }
      responses:
        '200':
          description: Success
  /v2/vectordb/collections/flush:
    post:
      summary: Flush collection data to storage
      operationId: flushCollection
      tags: [Collections]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                collectionName: { type: string }
      responses:
        '200':
          description: Success
  /v2/vectordb/collections/compact:
    post:
      summary: Compact a collection
      operationId: compactCollection
      tags: [Collections]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                collectionName: { type: string }
      responses:
        '200':
          description: Success
  /v2/vectordb/collections/alter-properties:
    post:
      summary: Alter collection properties
      operationId: alterCollectionProperties
      tags: [Collections]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Success
  /v2/vectordb/collections/get-load-state:
    get:
      summary: Get a collection's load state
      operationId: getCollectionLoadState
      tags: [Collections]
      parameters:
        - name: collectionName
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Load state
  /v2/vectordb/entities/insert:
    post:
      summary: Insert entities/vectors
      operationId: insertEntities
      tags: [Entities]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                collectionName: { type: string }
                data:
                  type: array
                  items: { type: object }
                partitionName: { type: string }
      responses:
        '200':
          description: Inserted
  /v2/vectordb/entities/upsert:
    post:
      summary: Upsert entities
      operationId: upsertEntities
      tags: [Entities]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                collectionName: { type: string }
                data:
                  type: array
                  items: { type: object }
      responses:
        '200':
          description: Upserted
  /v2/vectordb/entities/delete:
    post:
      summary: Delete entities
      operationId: deleteEntities
      tags: [Entities]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                collectionName: { type: string }
                filter: { type: string }
      responses:
        '200':
          description: Deleted
  /v2/vectordb/entities/get:
    post:
      summary: Get entities by id
      operationId: getEntities
      tags: [Entities]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                collectionName: { type: string }
                id:
                  oneOf:
                    - { type: integer }
                    - { type: string }
                    - { type: array, items: { type: integer } }
                outputFields:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: Entities
  /v2/vectordb/entities/query:
    post:
      summary: Query entities with a scalar filter
      operationId: queryEntities
      tags: [Entities]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                collectionName: { type: string }
                filter: { type: string }
                outputFields:
                  type: array
                  items: { type: string }
                limit: { type: integer }
                offset: { type: integer }
      responses:
        '200':
          description: Query results
  /v2/vectordb/entities/search:
    post:
      summary: Vector similarity search
      operationId: searchEntities
      tags: [Entities]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                collectionName: { type: string }
                data:
                  type: array
                  items:
                    type: array
                    items: { type: number }
                annsField: { type: string }
                limit: { type: integer }
                filter: { type: string }
                outputFields:
                  type: array
                  items: { type: string }
                searchParams: { type: object }
      responses:
        '200':
          description: Search results
  /v2/vectordb/entities/hybrid_search:
    post:
      summary: Hybrid (multi-vector) search
      operationId: hybridSearchEntities
      tags: [Entities]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                collectionName: { type: string }
                search:
                  type: array
                  items: { type: object }
                rerank: { type: object }
                limit: { type: integer }
      responses:
        '200':
          description: Hybrid search results
  /v2/vectordb/indexes/create:
    post:
      summary: Create an index
      operationId: createIndex
      tags: [Indexes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                collectionName: { type: string }
                indexParams:
                  type: array
                  items: { type: object }
      responses:
        '200':
          description: Index created
  /v2/vectordb/indexes/drop:
    post:
      summary: Drop an index
      operationId: dropIndex
      tags: [Indexes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                collectionName: { type: string }
                indexName: { type: string }
      responses:
        '200':
          description: Index dropped
  /v2/vectordb/indexes/list:
    post:
      summary: List indexes for a collection
      operationId: listIndexes
      tags: [Indexes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                collectionName: { type: string }
      responses:
        '200':
          description: Indexes
  /v2/vectordb/indexes/describe:
    post:
      summary: Describe an index
      operationId: describeIndex
      tags: [Indexes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                collectionName: { type: string }
                indexName: { type: string }
      responses:
        '200':
          description: Index details
  /v2/vectordb/partitions/create:
    post:
      summary: Create a partition
      operationId: createPartition
      tags: [Partitions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                collectionName: { type: string }
                partitionName: { type: string }
      responses:
        '200':
          description: Created
  /v2/vectordb/partitions/drop:
    post:
      summary: Drop a partition
      operationId: dropPartition
      tags: [Partitions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                collectionName: { type: string }
                partitionName: { type: string }
      responses:
        '200':
          description: Dropped
  /v2/vectordb/partitions/list:
    post:
      summary: List partitions for a collection
      operationId: listPartitions
      tags: [Partitions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                collectionName: { type: string }
      responses:
        '200':
          description: Partitions
  /v2/vectordb/users/create:
    post:
      summary: Create a user
      operationId: createUser
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userName: { type: string }
                password: { type: string }
      responses:
        '200':
          description: Created
  /v2/vectordb/users/list:
    post:
      summary: List users
      operationId: listUsers
      tags: [Users]
      responses:
        '200':
          description: Users
  /v2/vectordb/roles/create:
    post:
      summary: Create a role
      operationId: createRole
      tags: [Roles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                roleName: { type: string }
      responses:
        '200':
          description: Created
  /v2/vectordb/roles/list:
    post:
      summary: List roles
      operationId: listRoles
      tags: [Roles]
      responses:
        '200':
          description: Roles
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: |
        Bearer token of the form `username:password` (e.g. `root:milvus`) when
        authentication is enabled.
  schemas:
    StatusResponse:
      type: object
      properties:
        code: { type: integer }
        data: { type: object }
        message: { type: string }
